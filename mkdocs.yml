site_name: Guía de Timing de Subtítulos
site_description: >-
  Método para decidir, con criterio justificable, en qué instante aparece y
  desaparece cada línea de subtítulo: fundamentos del timing y fase técnica.
site_author: Kiterow
site_url: https://kiterowx.github.io/Arquitectura-del-Timing/

theme:
  name: material
  language: es
  icon:
    logo: material/timer-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: Contenido
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
  - stylesheets/video-layout.css

extra_javascript:
  - javascripts/video-controls.js
  - javascripts/external-links.js

nav:
  - Inicio: index.md
  - Fundamentos del timing:
      - fundamentos/index.md
      - Teoría general del borde: fundamentos/teoria.md
      - Segmentación de frases: fundamentos/segmentacion.md
      - Raw timing (pegado): fundamentos/raw-timing.md
      - Jerarquía de decisión: fundamentos/filosofia.md
      - Post-timing: fundamentos/post-timing.md
      - Casos de decisión: fundamentos/casos.md
      - Casos avanzados: fundamentos/casos-avanzados.md
      - Criterios cuantitativos: fundamentos/criterios.md
      - Glosario: fundamentos/glosario.md
  - Fase técnica:
      - tecnica/index.md
      - Flujo de trabajo: tecnica/flujo.md
      - División de líneas: tecnica/division-lineas.md
      - Generadores de señales: tecnica/generadores.md
      - Motor de timing: tecnica/motor.md
      - Postprocesado: tecnica/postprocesado.md
      - Onda comprimida y editor web: tecnica/web.md
      - Auditoría y marcadores: tecnica/auditoria.md
  - Algoritmos y automatización:
      - algoritmos/index.md
  - Referencias: referencias.md
