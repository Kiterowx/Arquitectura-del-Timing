site_name: The subtitle timing guide
site_description: >-
  A practical guide to speech boundaries, reading time, scene cuts,
  and subtitle timing with Aegisub and Chrono Suite.
site_author: Kite
site_url: https://kiterowx.github.io/Arquitectura-del-Timing/

theme:
  name: material
  language: en
  icon:
    logo: material/timer-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/video-controls.js
  - javascripts/external-links.js
  - javascripts/reading-speed.js
  - javascripts/language-switch.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_name: Guía de timing de subtítulos
          site_description: Guía para ajustar voz, lectura, cortes de escena y continuidad con Aegisub y Chrono Suite.
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: teal
                accent: teal
                toggle:
                  icon: material/weather-night
                  name: Cambiar a modo oscuro
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: teal
                accent: teal
                toggle:
                  icon: material/weather-sunny
                  name: Cambiar a modo claro
          nav_translations:
            Home: Inicio
            Fundamentals: Fundamentos
            What a timing boundary does: Inicio y final del subtítulo
            Segment the dialogue: Segmentar el diálogo
            Raw timing: Timing bruto
            Resolve competing priorities: Resolver prioridades
            Padding, snapping, and chaining: Márgenes, snap y cadenas
            Timing decisions in practice: Decisiones en la práctica
            Timing exceptions: Casos avanzados
            Reading speed and limits: Velocidad de lectura y límites
            Glossary: Glosario
            Tools and workflow: Herramientas y flujo de trabajo
            The episode workflow: Un episodio de principio a fin
            Split, rebreak, and join: Dividir, renglonar y unir
            Prepare the vocal track: Preparar las vocales
            Generate analysis files: Generar archivos de análisis
            Post-timing tools: Herramientas de post-timing
            Waveform JSON and SubWave: Waveform JSON y SubWave
            Audit the timing: Auditar el timing
            Algorithm notes: Algoritmos
            References: Referencias

nav:
  - Home: index.md
  - Fundamentals:
      - fundamentos/index.md
      - What a timing boundary does: fundamentos/teoria.md
      - Segment the dialogue: fundamentos/segmentacion.md
      - Raw timing: fundamentos/raw-timing.md
      - Resolve competing priorities: fundamentos/filosofia.md
      - Padding, snapping, and chaining: fundamentos/post-timing.md
      - Timing decisions in practice: fundamentos/casos.md
      - Timing exceptions: fundamentos/casos-avanzados.md
      - Reading speed and limits: fundamentos/criterios.md
      - Glossary: fundamentos/glosario.md
  - Tools and workflow:
      - tecnica/index.md
      - The episode workflow: tecnica/flujo.md
      - Split, rebreak, and join: tecnica/division-lineas.md
      - Prepare the vocal track: tecnica/vocales.md
      - Generate analysis files: tecnica/generadores.md
      - Auto Timing: tecnica/motor.md
      - Post-timing tools: tecnica/postprocesado.md
      - Waveform JSON and SubWave: tecnica/web.md
      - Audit the timing: tecnica/auditoria.md
  - Algorithm notes:
      - algoritmos/index.md
  - References: referencias.md
